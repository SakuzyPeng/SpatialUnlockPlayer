name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS 27 · ARM64
    runs-on: xcode-27
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
          architecture: arm64

      - name: Install CI dependencies
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          python3 -m pip install --no-cache-dir -r Tests/requirements-ci.txt

      - name: Build, test, and package
        run: zsh Scripts/ci.sh

      - name: Upload ad hoc application
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: SpatialUnlockPlayer-macos-arm64-ad-hoc-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            build/ci/SpatialUnlockPlayer-macos-arm64.zip
            build/ci/SpatialUnlockPlayer-macos-arm64.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload check logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ci-logs-${{ github.run_attempt }}
          path: |
            build/ci/*.log
            Tests/Artifacts/equalizer/dsp-result.json
          if-no-files-found: ignore
          retention-days: 7
